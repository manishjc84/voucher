<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$750 Shopping Survey</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .survey-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    .header {
      height: 155px;
      background: linear-gradient(135deg, #182b5a, #294b9b);
      color: #fff;
      text-align: center;
      padding: 22px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.15;
      font-weight: 700;
    }

    .reward {
      width: 195px;
      margin: -45px auto 0;
      position: relative;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
    }

    .reward-top {
      background: linear-gradient(#2680e8, #0c5fbe);
      color: white;
      font-size: 38px;
      padding: 12px 0 5px;
    }

    .shopping {
      color: #2255a0;
      font-size: 22px;
      font-weight: bold;
      padding: 7px 0 2px;
      letter-spacing: .5px;
    }

    .small {
      color: #aaa;
      font-size: 7px;
      padding-bottom: 8px;
    }

    .content {
      padding: 32px 22px 28px;
      text-align: center;
    }

    .progress {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-bottom: 23px;
    }

    .progress span {
      width: 55px;
      height: 4px;
      background: #e5e5e5;
      border-radius: 4px;
    }

    .progress span.active {
      background: #2d73d5;
    }

    .question-count {
      font-size: 11px;
      color: #777;
      margin-left: 8px;
    }

    .question {
      font-size: 19px;
      color: #333;
      margin: 0 0 20px;
      font-weight: 600;
    }

    .option {
      width: 100%;
      min-height: 62px;
      border: 1px solid #e1e1e1;
      background: #fff;
      display: flex;
      align-items: center;
      text-align: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      font-size: 17px;
      color: #666;
      transition: .2s;
      margin-bottom: 9px;
    }

    .option:hover {
      background: #f7f9ff;
    }

    .option.selected {
      border: 2px solid #2875d6;
      background: #eef5ff;
      color: #1c5dab;
      font-weight: bold;
    }

    .icon {
      position: absolute;
      left: 16px;
      font-size: 22px;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 14px;
      margin-top: 12px;
      background: #2875d6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .submit:hover {
      background: #1e5fb2;
    }

    .submit:disabled {
      background: #b8c8dc;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      background: #eaf7ed;
      color: #21723a;
    }

    @media (max-width: 450px) {
      body { padding: 10px; }
      .header h1 { font-size: 23px; }
      .reward { width: 175px; }
    }
  </style>
</head>
<body>

  <div class="survey-card">

    <div class="header">
      <h1>Get $750 Toward Online<br>Shopping</h1>
    </div>

    <div class="reward">
      <div class="reward-top">$750</div>
      <div class="shopping">SHOPPING</div>
      <div class="small">Independent promotional reward</div>
    </div>

    <div class="content">

      <div class="progress">
        <span class="active"></span>
        <span></span>
        <span></span>
        <div class="question-count">Question 1 of 3</div>
      </div>

      <div id="questionArea">
        <p class="question">Are you shopping online?</p>

        <div class="option" onclick="selectOption(this, 'Yes')">
          <span class="icon">👍</span>
          Yes
        </div>

        <div class="option" onclick="selectOption(this, 'No')">
          <span class="icon">👎</span>
          No
        </div>
      </div>

      <button class="submit" id="submitBtn" disabled onclick="nextQuestion()">
        Next
      </button>

      <div class="message" id="message"></div>

  </div>

  <script>
    let currentQuestion = 1;
    let selectedAnswer = "";
    const answers = {};

    function selectOption(element, answer) {
      document.querySelectorAll(".option").forEach(option => {
        option.classList.remove("selected");
      });

      element.classList.add("selected");
      selectedAnswer = answer;
      document.getElementById("submitBtn").disabled = false;
    }

    function nextQuestion() {
      if (!selectedAnswer) return;
      answers[currentQuestion] = selectedAnswer;

      if (currentQuestion < 3) {
        currentQuestion++;
        selectedAnswer = "";

        const questionArea = document.getElementById("questionArea");
        questionArea.style.transform = "translateX(40px)";
        questionArea.style.opacity = "0";

        setTimeout(() => {
          if (currentQuestion === 2) {
            questionArea.innerHTML = `
              <p class="question">Are you 18 years or older?</p>
              <div class="option" onclick="selectOption(this, 'Yes')"><span class="icon">👍</span>Yes</div>
              <div class="option" onclick="selectOption(this, 'No')"><span class="icon">👎</span>No</div>`;
          } else {
            questionArea.innerHTML = `
              <p class="question">Are you male or female?</p>
              <div class="option" onclick="selectOption(this, 'Male')"><span class="icon">👨</span>Male</div>
              <div class="option" onclick="selectOption(this, 'Female')"><span class="icon">👩</span>Female</div>`;
          }

          document.querySelectorAll(".progress span").forEach((span, i) => {
            span.classList.toggle("active", i < currentQuestion);
          });
          document.querySelector(".question-count").textContent = `Question ${currentQuestion} of 3`;
          document.getElementById("submitBtn").textContent = currentQuestion === 3 ? "Submit" : "Next";
          document.getElementById("submitBtn").disabled = true;

          questionArea.style.transition = "transform .35s ease, opacity .35s ease";
          questionArea.style.transform = "translateX(0)";
          questionArea.style.opacity = "1";
        }, 180);
      } else {
        showSubmitPage();
      }
    }

    function showSubmitPage() {
      document.getElementById("questionArea").innerHTML = `
        <p class="question">Submit</p>
        <p style="color:#777; font-size:14px; margin-bottom:10px;">Your answers have been recorded.</p>`;
      document.getElementById("submitBtn").style.display = "none";
      const message = document.getElementById("message");
      message.textContent = "Survey completed successfully!";
      message.style.display = "block";
      document.querySelectorAll(".progress span").forEach(span => span.classList.add("active"));
    }
  </script>

</body>
</html>
