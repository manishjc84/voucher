<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$750 Shopping Survey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .survey-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    .header {
      background: linear-gradient(135deg, #182b5a, #294b9b);
      color: #fff;
      text-align: center;
      padding: 24px 15px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
    }

    .content {
      padding: 24px 22px 28px;
      text-align: center;
    }

    .reward-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin-bottom: 12px;
    }

    .reward-selection {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 24px;
    }

    .reward-item {
      flex: 1;
      border: 2px solid #e1e1e1;
      border-radius: 10px;
      padding: 8px 5px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .reward-item:hover {
      border-color: #2d73d5;
      background: #f7f9ff;
    }

    .reward-item.selected {
      border-color: #2875d6;
      background: #eef5ff;
      box-shadow: 0 4px 10px rgba(40,117,214,.15);
    }

    .reward-item img {
      width: 100%;
      height: 55px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .reward-item span {
      font-size: 12px;
      font-weight: bold;
      color: #555;
    }

    .progress {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-bottom: 23px;
    }

    .progress span {
      width: 55px;
      height: 4px;
      background: #e5e5e5;
      border-radius: 4px;
    }

    .progress span.active {
      background: #2d73d5;
    }

    .question-count {
      font-size: 11px;
      color: #777;
      margin-left: 8px;
    }

    #questionArea {
      transition: transform .35s ease, opacity .35s ease;
    }

    .question {
      font-size: 19px;
      color: #333;
      margin: 0 0 20px;
      font-weight: 600;
    }

    .option {
      width: 100%;
      min-height: 58px;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      text-align: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      font-size: 17px;
      color: #555;
      transition: .2s;
      margin-bottom: 10px;
    }

    .option:hover {
      background: #f7f9ff;
    }

    .option.selected {
      border: 2px solid #2875d6;
      background: #eef5ff;
      color: #1c5dab;
      font-weight: bold;
    }

    .icon {
      position: absolute;
      left: 16px;
      font-size: 20px;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
      background: #2875d6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .submit:hover {
      background: #1e5fb2;
    }

    .submit:disabled {
      background: #b8c8dc;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      background: #eaf7ed;
      color: #21723a;
      font-weight: bold;
    }

    @media (max-width: 450px) {
      body {
        padding: 10px;
      }

      .header h1 {
        font-size: 21px;
      }

      .reward-item img {
        height: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="survey-card">

    <div class="header">
      <h1>Get $750 Toward Online Shopping</h1>
    </div>

    <div class="content">

      <!-- Gift Card Selection -->
      <div class="reward-section-title">
        Select your preferred $750 Gift Card:
      </div>

      <div class="reward-selection">

        <div class="reward-item selected"
             onclick="selectCard(this, 'Amazon')">
          <img
            src="https://st3.depositphotos.com/1008960/33610/i/450/depositphotos_336109386-stock-photo-amazon-gift-card-black-background.jpg"
            alt="Amazon Gift Card">
          <span>Amazon</span>
        </div>

        <div class="reward-item"
             onclick="selectCard(this, 'Target')">
          <img
            src="https://www.nicepng.com/png/full/11-112487_gift-card-target-target-gift-card-png.png"
            alt="Target Gift Card">
          <span>Target</span>
        </div>

        <div class="reward-item"
             onclick="selectCard(this, 'SHEIN')">
          <img
            src="https://www.mygiftcardsupply.com/wp-content/uploads/2023/03/Shein-Gift-Cards.png.webp"
            alt="SHEIN Gift Card">
          <span>SHEIN</span>
        </div>

      </div>

      <!-- Progress -->
      <div class="progress">
        <span class="active"></span>
        <span></span>
        <span></span>
        <div class="question-count">
          Question 1 of 3
        </div>
      </div>

      <!-- Questions -->
      <div id="questionArea">

        <p class="question">
          Are you shopping online?
        </p>

        <div class="option"
             onclick="selectOption(this, 'Yes')">
          <span class="icon">👍</span>
          Yes
        </div>

        <div class="option"
             onclick="selectOption(this, 'No')">
          <span class="icon">👎</span>
          No
        </div>

      </div>

      <!-- Main Button -->
      <button
        class="submit"
        id="submitBtn"
        disabled
        onclick="nextQuestion()">
        Next
      </button>

      <div class="message" id="message"></div>

    </div>
  </div>


  <script>

    let currentQuestion = 1;
    let selectedAnswer = "";
    let selectedCard = "Amazon";

    const answers = {};


    /* Gift Card Selection */
    function selectCard(element, cardName) {

      document.querySelectorAll(".reward-item")
        .forEach(item => {
          item.classList.remove("selected");
        });

      element.classList.add("selected");

      selectedCard = cardName;
    }


    /* Answer Selection */
    function selectOption(element, answer) {

      document.querySelectorAll(".option")
        .forEach(option => {
          option.classList.remove("selected");
        });

      element.classList.add("selected");

      selectedAnswer = answer;

      document.getElementById("submitBtn").disabled = false;
    }


    /* Next Button */
    function nextQuestion() {

      if (!selectedAnswer) return;

      answers[currentQuestion] = selectedAnswer;

      if (currentQuestion < 3) {

        currentQuestion++;

        selectedAnswer = "";

        const questionArea =
          document.getElementById("questionArea");

        questionArea.style.transform = "translateX(40px)";
        questionArea.style.opacity = "0";


        setTimeout(() => {

          /* Question 2 */
          if (currentQuestion === 2) {

            questionArea.innerHTML = `
              <p class="question">
                Are you 18 years or older?
              </p>

              <div class="option"
                   onclick="selectOption(this, 'Yes')">
                <span class="icon">👍</span>
                Yes
              </div>

              <div class="option"
                   onclick="selectOption(this, 'No')">
                <span class="icon">👎</span>
                No
              </div>
            `;

          }

          /* Question 3 */
          else {

            questionArea.innerHTML = `
              <p class="question">
                Are you male or female?
              </p>

              <div class="option"
                   onclick="selectOption(this, 'Male')">
                <span class="icon">👨</span>
                Male
              </div>

              <div class="option"
                   onclick="selectOption(this, 'Female')">
                <span class="icon">👩</span>
                Female
              </div>
            `;

          }


          /* Progress Update */
          document
            .querySelectorAll(".progress span")
            .forEach((span, i) => {
              span.classList.toggle(
                "active",
                i < currentQuestion
              );
            });


          document.querySelector(".question-count")
            .textContent =
            `Question ${currentQuestion} of 3`;


          /*
            IMPORTANT:
            Question 3 par bhi Next hi rahega.
            Next click karne ke baad final page open hoga.
          */
          document.getElementById("submitBtn")
            .textContent = "Next";

          document.getElementById("submitBtn")
            .disabled = true;


          questionArea.style.transform = "translateX(0)";
          questionArea.style.opacity = "1";

        }, 180);

      }

      else {

        showFinalPage();

      }
    }


    /* Final Page */
    function showFinalPage() {

      answers["selectedCard"] = selectedCard;

      const questionArea =
        document.getElementById("questionArea");


      /*
        Survey Complete text removed.
        Instead final page has a simple confirmation message.
      */
      questionArea.innerHTML = `
        <p class="question">
          Please review your selection
        </p>

        <p style="
          color:#666;
          font-size:14px;
          margin-bottom:10px;
        ">
          Your responses are ready to be submitted.
        </p>
      `;


      /*
        FINAL PAGE:
        Button changes from Next -> Submit
      */
      const submitBtn =
        document.getElementById("submitBtn");

      submitBtn.textContent = "Submit";

      submitBtn.disabled = false;

      submitBtn.style.display = "block";


      /* Progress complete */
      document
        .querySelectorAll(".progress span")
        .forEach(span => {
          span.classList.add("active");
        });

      document.querySelector(".question-count")
        .textContent = "Ready to submit";


      /* Submit action */
      submitBtn.onclick = submitSurvey;
    }


    /* Final Submit */
    function submitSurvey() {

      const submitBtn =
        document.getElementById("submitBtn");

      submitBtn.disabled = true;

      submitBtn.textContent = "Submitted";

      const message =
        document.getElementById("message");

      message.textContent =
        "Your survey has been submitted successfully.";

      message.style.display = "block";
    }

  </script>

</body>
</html>
